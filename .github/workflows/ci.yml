name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 快的先跑：单元 + 集成，不启 HTTP 服务、不需要 Redis ──────────
  unit:
    name: 单元 + 集成
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: student_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: testpass
      DB_NAME: student_db_test
      DB_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 与本地 .venv 的基底版本保持一致（本地是 3.14.10）
          python-version: "3.14"
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          # 用 lock 而不是 txt：lock 是精确版本，txt 只有区间。
          # 用 txt 的话 CI 可能装到比本地更新的依赖 → 出现"本地绿、CI 红"。
          pip install -r requirements.lock
      - name: 跑单元 + 集成（排除 e2e）
        # 必须排除 e2e：它会真起 uvicorn、真连 Redis，属于下面那个 job 的事。
        # 不排除的话同一个用例跑两遍，而且这里没有 Redis，只能走降级。
        run: pytest -m "not e2e" -v

  # ── 贵的单独跑：真起服务 + 真 Redis ────────────────────────────
  e2e:
    name: 端到端（真服务 + 真 Redis）
    runs-on: ubuntu-latest
    needs: unit                 # 单元/集成先过，省得白等
    services:
      # services 是 job 级配置；不同 job 之间不共享容器 —— 所以这里要再声明一次
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: student_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: testpass
      DB_NAME: student_db_test
      DB_PORT: "3306"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: 确认 Redis 真的可用
        # 防"假绿"：cache.py 连不上 Redis 会降级成直接查库，
        # e2e 照样全绿，但"缓存一致性"根本没被测到。宁可在这里红。
        run: |
          python -c "import redis; r = redis.Redis(host='127.0.0.1', port=6379, protocol=2); assert r.ping(); print('redis ok')"

      - name: 建表（跑真实迁移）
        # tests/conftest.py 的 prepare_database 只在"选中的用例含 integration"时才建表；
        # 这里只跑 -m e2e 不会触发它 —— 所以显式迁移，顺带验证迁移脚本可执行。
        run: alembic upgrade head

      - name: 跑 e2e
        run: pytest -m e2e -v
