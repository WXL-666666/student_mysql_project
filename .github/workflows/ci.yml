name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: student_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: testpass
      DB_NAME: student_db_test
      DB_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 与本地 .venv 的基底版本保持一致（本地是 3.14.10）
          python-version: "3.14"
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          # 用 lock 而不是 txt：lock 是精确版本，txt 只有区间。
          # 用 txt 的话 CI 可能装到比本地更新的依赖 → 出现"本地绿、CI 红"。
          pip install -r requirements.lock
      - name: 跑全部测试
        run: pytest -v